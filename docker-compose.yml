services:
  postgres:
    image: postgres:18-alpine
    container_name: mpaz-postgres
    environment:
      POSTGRES_DB: mpaz
      POSTGRES_USER: mpaz
      POSTGRES_PASSWORD: mpaz
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-usuarios:
    build: ./ms-usuarios
    container_name: mpaz-usuarios
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/mpaz?currentSchema=usuarios
      DB_USER: mpaz
      DB_PASSWORD: mpaz
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ms-mensajeria:
    build: ./ms-mensajeria
    container_name: mpaz-mensajeria
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/mpaz?currentSchema=mensajeria
      DB_USER: mpaz
      DB_PASSWORD: mpaz
      HISTORIAL_URL: http://ms-historial:8083
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  ms-historial:
    build: ./ms-historial
    container_name: mpaz-historial
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/mpaz?currentSchema=historial
      DB_USER: mpaz
      DB_PASSWORD: mpaz
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos_postgres:
