server:
  port: ${PORT:8082}
  address: 0.0.0.0

spring:
  application:
    name: ms-mensajeria
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

historial:
  url: ${HISTORIAL_URL:https://mpaz-historial.onrender.com}

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mpaz_mensajeria;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "${DB_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=mensajeria}"
    username: "${DB_USER:postgres.xgbjpmynwghfcphjjfgo}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
